<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перенаправление…</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://radio.brodiaga.com/watch/">
<script>
  (function(){
    var p = new URLSearchParams(location.search);
    var id = p.get('id');
    if (id && /^[A-Za-z0-9_-]{11}$/.test(id)) {
      location.replace('/watch/' + id + '.html');
    } else {
      location.replace('/watch/');
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=/watch/">
</head>
<body>
<p>Перенаправление на <a href="/watch/">список видео</a>…</p>
</body>
</html>
